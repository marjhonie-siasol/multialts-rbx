<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiAlts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup">
        <!-- Top Bar (Clean Branding) -->
        <header class="header-row">
            <div class="brand-title-wrap">
                <img src="icon48.png" alt="Logo" class="brand-logo">
                <span class="brand-title">MultiAlts</span>
            </div>
        </header>

        <!-- Engine Status Banner (Active vs Offline with Guide Link) -->
        <div class="engine-notice-bar" id="engineNoticeBar">
            <span class="notice-pip"></span>
            <span class="notice-text">Checking engine status...</span>
        </div>

        <!-- Accounts Section -->
        <section class="accounts-section">
            <div class="accounts-head">
                <span class="section-title">Roblox Accounts</span>
                <button class="btn-manage-accounts" id="manageAccountsBtn" type="button">Manage</button>
            </div>

            <div class="accounts-list" id="accountsList">
                <div class="empty-state" id="emptyState">No accounts saved</div>
            </div>

            <button class="btn-alt-login" id="newLoginBtn">+ Add Roblox Account</button>
        </section>

        <!-- Footers with Collapsible Dropdowns -->
        <div class="collapsible-group">
            
            <!-- 1. PowerShell Install Dropdown (Above Uninstall) -->
            <div class="collapsible-section">
                <button class="btn-collapse-toggle" id="engineSetupToggleBtn" type="button">
                    <span>Need the PowerShell engine?</span>
                    <svg class="toggle-icon" id="engineSetupToggleIcon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="collapse-panel" id="engineSetupPanel" style="display: none;">
                    <p class="collapse-desc">
                        Paste into PowerShell to unlock multiple game windows:
                    </p>
                    <div class="command-box">
                        <textarea readonly id="commandInput" class="command-text">irm https://raw.githubusercontent.com/marjhonie-siasol/multialts-rbx/main/install.ps1 | iex</textarea>
                    </div>
                    <div class="collapse-actions">
                        <button class="btn-copy-main" id="copyCommandBtn" type="button">
                            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                            Copy Command
                        </button>
                        <a href="https://marjhonie-siasol.github.io/multialts-rbx/#setup" target="_blank" rel="noopener" class="guide-link" id="helpLink">
                            Install Guide &rarr;
                        </a>
                    </div>
                </div>
            </div>

            <!-- 2. Uninstall Dropdown -->
            <div class="collapsible-section">
                <button class="btn-collapse-toggle" id="uninstallToggleBtn" type="button">
                    <span>Looking to uninstall?</span>
                    <svg class="toggle-icon" id="uninstallToggleIcon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="collapse-panel" id="uninstallPanel" style="display: none;">
                    <p class="collapse-desc">
                        Paste into PowerShell to restore default single-instance limits:
                    </p>
                    <div class="command-box">
                        <textarea readonly id="uninstallCommandInput" class="command-text">irm https://raw.githubusercontent.com/marjhonie-siasol/multialts-rbx/main/uninstall.ps1 | iex</textarea>
                    </div>
                    <div class="collapse-actions">
                        <button class="btn-copy-main" id="copyUninstallBtn" type="button">
                            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                            Copy Command
                        </button>
                        <a href="https://marjhonie-siasol.github.io/multialts-rbx/#uninstall" target="_blank" rel="noopener" class="guide-link" id="uninstallGuideLink">
                            Uninstall Guide &rarr;
                        </a>
                    </div>
                </div>
            </div>

        </div>

        <!-- Toast Notification -->
        <div class="toast" id="toast"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
